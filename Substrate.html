var D={
en:{name:"English",seal:"基",sub:"Substrate Surfaces for HS-AFM Imaging of Proteins",
s:[
{h:"Why substrates matter",l:[
"Surface roughness must be far smaller than the target molecules, which are typically only a few nanometres in size. Unlike single-molecule fluorescence, the substrate itself limits what HS-AFM can resolve.",
"AFM sees a sample only from above, so molecules sometimes must be attached in a defined orientation to expose the structural features of interest.",
"In dynamic imaging the molecule–surface interaction must be balanced: too strong and it perturbs function; too weak and molecules diffuse too fast to be imaged.",
"To image interactions between two species, selective immobilization is often needed: one partner is fixed without losing activity while the other stays free in solution.",
"The available substrate options are still limited, so choosing and tuning the surface is part of experimental design."]},
{h:"10.1 Bare and functionalized mica",l:[
"Mica (muscovite or synthetic fluorophlogopite) is the first thing to try: easy to prepare, atomically flat over large areas, and able to adsorb almost any protein.",
"Cleaved mica is negatively charged in water (K⁺ is released), so it favours positively charged proteins. Monovalent cations weaken adsorption in the order K⁺ > Na⁺ > Li⁺, and pH offers further tuning.",
"Negatively charged proteins can bind via divalent cations (Mg²⁺, Ca²⁺, Ni²⁺, Zn²⁺), which remain on the surface even after washing with water.",
"Orientation is generally not controlled and often maximizes the contact area, but exceptions exist: GroEL and ClpB tend to sit end-up.",
"Native membrane fragments and supported lipid bilayers (SLBs) are well suited to bare mica because a ~1 nm water layer can separate the membrane from the surface.",
"Functionalization: surface silanols react with organosilanes. APTES gives a positively charged NH₂ surface; dilute it 10,000–100,000-fold with water just before deposition to avoid polymerization and roughness.",
"Glutaraldehyde on the NH₂ surface yields an amine-reactive surface for covalent, often oriented, immobilization (e.g. lysine-tagged α3β3 of F1-ATPase, bR trimers)."]},
{h:"10.2 Mica-supported lipid bilayers (SLBs)",l:[
"Small liposomes ruptured on mica fuse into an SLB with negligible roughness covering the whole support; the process can be followed by HS-AFM (Fig. 10.1).",
"Zwitterionic heads (PC, PE) resist protein adsorption. Biotin-lipids bind streptavidin-conjugated proteins; Ni–NTA lipids capture His-tagged proteins (e.g. p97); biotinylated actin on streptavidin-bound SLBs was used for myosin V.",
"Charged lipids (PS, PA, PG negative; TAP, EPC positive) give electrostatic attachment, and the surface charge density is easily tuned by mixing charged and neutral lipids, provided no phase separation occurs.",
"Chain saturation sets fluidity: unsaturated lipids such as DOPC (transition near −20 °C) give highly fluid SLBs. These are unsuitable for isolated single molecules but useful for densely packed proteins, which diffuse less and may form 2D crystals with low corrugation and high-resolution images (streptavidin, annexin V)."]},
{h:"10.3 Streptavidin 2D crystals",l:[
"Streptavidin is a D2-symmetric homotetramer; in the 2D crystal two biotin-binding sites face the solution, and nonspecific protein binding is low. Biotinylated proteins (or His-tagged proteins via biotinylated Ni–NTA) attach in a controlled orientation.",
"Crystals form on fluid biotin-containing SLBs in three arrangements (Types 1–3, P2 symmetry) depending on pH and ionic strength, and remain stable for more than 12 h after a buffer change. Glutaraldehyde adds mechanical strength while keeping biotin affinity.",
"Type 3 (pH 4.0, high ionic strength) is the smoothest, with roughness of 0.2–0.3 nm, and is the most useful for HS-AFM.",
"Limitation: a single biotin–streptavidin bond lets the protein rotate. Reduce motility with dibiotin reagents, multi-site biotinylation, or charged biotin compounds, so the surface is of limited use for monomeric proteins.",
"Best for homo-oligomers pinned at several sites: actin polymerization, GroEL–GroES interactions, and conformational changes of p97."]},
{h:"10.4 Tamavidin 2D crystals",l:[
"Streptavidin crystals need two steps (SLB, then crystallization) and several hours. The tamavidin 2 mutein LPI (TM2-LPI) crystallizes directly on mica in 5–10 min, and its lower isoelectric point reduces nonspecific binding (slightly higher than streptavidin).",
"Protocol outline: dilute TM2-LPI to 0.12 mg mL⁻¹ in 20 mM HEPES–NaOH pH 8.5, 400 mM NaCl, 200 mM MgCl₂, 20% (w/v) PEG 8000; incubate 30–50 min at 21 °C; deposit on fresh mica; rinse with PEG-free buffer; fix 5 min with 2% glutaraldehyde in 20 mM HEPES–NaOH pH 8.0; rinse with observation buffer.",
"Roughness is about 1 nm (Fig. 10.2b), rougher than streptavidin Type 3. So far it has only been used to attach biotinylated GroEL side-on, allowing GroES binding at both ring ends.",
"Vacant defects can be made with 400 mM MgCl₂ plus 0.01% glutaraldehyde. After forming a biotin-containing SLB, membrane proteins can be trapped in the holes, creating asymmetric environments across the membrane, but proteins taller than ~4 nm from the lower membrane surface do not fit."]}
],
tt:"Comparison of surfaces",th:["Surface","Character","Attachment","Best suited for"],
tr:[
["Bare mica","Atomically flat, negative charge","Electrostatic; divalent cations for acidic proteins","First trial; native membranes and SLBs"],
["APTES / glutaraldehyde mica","Positive NH₂; covalent coupling","Covalent, often oriented","Stable fixation (F1-ATPase α3β3, bR trimers)"],
["SLB","Negligible roughness; fluid or tunable","Biotin, Ni–NTA, or charged lipids","Controlled affinity; dense proteins, 2D crystals"],
["Streptavidin 2D crystal","0.2–0.3 nm (Type 3)","Biotin, multi-site pinning","Homo-oligomers: actin, GroEL–GroES, p97"],
["TM2-LPI 2D crystal","~1 nm; formed directly on mica in minutes","Biotin","Fast preparation; GroEL side-on"]],
kt:"Key takeaways for researchers",
k:["Start with bare mica and tune it with cations and pH; move to functionalized surfaces only when orientation or selectivity is required.",
"Use SLBs for controlled affinity and streptavidin 2D crystals for pinning homo-oligomers; dense layers give the smoothest, highest-resolution surfaces.",
"Always weigh roughness, orientation, and surface mobility against how strongly the surface may perturb function.",
"TM2-LPI offers a quick route, at the cost of higher roughness and limited validation so far."],
f:"Summary of Chapter 10, “Substrate Surfaces”, from T. Ando, High-Speed Atomic Force Microscopy in Biology, Springer, 2022."},

ja:{name:"日本語",seal:"基",sub:"タンパク質のHS-AFM観察のための基板表面",
s:[
{h:"基板が重要な理由",l:[
"表面粗さは、通常わずか数ナノメートルしかない観察対象分子よりもはるかに小さくなければなりません。単分子蛍光顕微鏡とは異なり、基板そのものがHS-AFMで分解できる対象を左右します。",
"AFMは試料を真上からしか観察できないため、注目する構造的特徴が見えるよう、分子を特定の向きで固定する必要がある場合があります。",
"動的観察では、分子と表面の相互作用のバランスが重要です。強すぎると機能を乱し、弱すぎると分子が速く動きすぎて撮像できません。",
"2種類の分子間の相互作用を観察するには、選択的固定がしばしば必要です。一方を活性を保ったまま固定し、もう一方は溶液中で自由にします。",
"利用できる基板の選択肢はまだ限られており、表面の選択と調整は実験設計の一部です。"]},
{h:"10.1 未修飾および機能化マイカ",l:[
"マイカ(白雲母または合成フッ素金雲母)は最初に試す基板です。調製が簡単で、広い範囲で原子レベルに平坦であり、ほぼあらゆるタンパク質を吸着できます。",
"劈開したマイカは水中で負に帯電し(K⁺が脱離)、正に帯電したタンパク質の吸着に有利です。1価カチオンは K⁺ > Na⁺ > Li⁺ の順に吸着を弱め、pHでもさらに調整できます。",
"負に帯電したタンパク質は、2価カチオン(Mg²⁺、Ca²⁺、Ni²⁺、Zn²⁺)を介して吸着でき、これらは水洗後も表面に残ります。",
"配向は一般に制御されず、接触面積を最大にする向きになることが多いですが、例外もあり、GroELやClpBは端面を上にして吸着しやすい傾向があります。",
"天然膜断片や支持脂質二重膜(SLB)は、約1 nmの水層が膜と表面を隔てるため、未修飾マイカに適しています。",
"機能化:表面のシラノールは有機シランと反応します。APTESは正に帯電したNH₂表面を与えます。重合による粗さの増加を防ぐため、滴下直前に水で1万〜10万倍に希釈します。",
"NH₂表面にグルタルアルデヒドを作用させるとアミン反応性表面となり、共有結合による(しばしば配向制御された)固定が可能です(例:リジンタグ付きF1-ATPase α3β3、bR三量体)。"]},
{h:"10.2 マイカ支持脂質二重膜(SLB)",l:[
"小さなリポソームがマイカ上で破裂・融合し、支持体全体を覆う粗さの無視できるSLBが形成されます。この過程はHS-AFMで観察できます(図10.1)。",
"双性イオン性頭部(PC、PE)はタンパク質吸着に抵抗します。ビオチン脂質はストレプトアビジン結合タンパク質を、Ni–NTA脂質はHisタグタンパク質(例:p97)を捕捉します。ミオシンVの観察には、ストレプトアビジン結合SLB上のビオチン化アクチンが用いられました。",
"荷電脂質(PS、PA、PGは負、TAP、EPCは正)により静電的に固定でき、相分離が起きない限り、荷電脂質と中性脂質の混合比で表面電荷密度を容易に調整できます。",
"アルキル鎖の飽和度が流動性を決めます。DOPC(相転移温度は約−20 °C)のような不飽和脂質は高流動性のSLBを与えます。これは孤立した単一分子には不向きですが、高密度のタンパク質には有用で、拡散が抑えられ、2次元結晶を形成して凹凸が小さく高分解能の観察が可能になります(ストレプトアビジン、アネキシンV)。"]},
{h:"10.3 ストレプトアビジン2次元結晶",l:[
"ストレプトアビジンはD2対称のホモ四量体で、2次元結晶では2つのビオチン結合部位が溶液側を向き、非特異的なタンパク質結合も少なくなります。ビオチン化タンパク質(またはビオチン化Ni–NTA経由のHisタグタンパク質)を、制御された向きで固定できます。",
"結晶は流動性のあるビオチン含有SLB上で形成し、pHとイオン強度により3種類の配列(タイプ1〜3、P2対称)をとり、緩衝液交換後も12時間以上安定です。グルタルアルデヒド処理で機械的強度が高まり、ビオチン親和性も保たれます。",
"タイプ3(pH 4.0、高イオン強度)は最も平滑で、粗さは0.2〜0.3 nmとHS-AFMに最も有用です。",
"制限:ビオチン–ストレプトアビジン1か所の結合では、タンパク質が回転できます。ジビオチン試薬、多点ビオチン化、荷電ビオチン化合物で運動性を下げられるため、単量体タンパク質への有用性は限られます。",
"複数箇所で固定できるホモオリゴマーに最適です:アクチン重合、GroEL–GroES相互作用、p97の構造変化。"]},
{h:"10.4 タマビジン2次元結晶",l:[
"ストレプトアビジン結晶はSLB形成と結晶化の2段階で数時間を要します。タマビジン2変異体LPI(TM2-LPI)はマイカ上で直接、5〜10分で結晶化し、等電点が低いため非特異的結合が少なくなります(ストレプトアビジンよりはやや多い)。",
"手順の概要:TM2-LPIを0.12 mg mL⁻¹に、20 mM HEPES–NaOH pH 8.5、400 mM NaCl、200 mM MgCl₂、20%(w/v)PEG 8000で希釈。21 °Cで30〜50分インキュベート。新しく劈開したマイカに滴下し、PEGなしの緩衝液で洗浄。20 mM HEPES–NaOH pH 8.0で希釈した2%グルタルアルデヒドで5分間固定し、観察用緩衝液で洗浄します。",
"粗さは約1 nm(図10.2b)で、ストレプトアビジンのタイプ3より粗くなります。これまでは、ビオチン化GroELを側面向きに固定し、両端のリングにGroESが結合できるようにする用途にのみ使われています。",
"400 mM MgCl₂と0.01%グルタルアルデヒドで処理すると、空孔欠陥を作れます。ビオチン含有SLBを形成すると、膜タンパク質を孔に捕捉して膜の両側で非対称な環境を与えられますが、下側の膜表面から約4 nmを超える高さのタンパク質は収まりません。"]}
],
tt:"表面の比較",th:["表面","特徴","固定方法","適した用途"],
tr:[
["未修飾マイカ","原子レベルで平坦、負電荷","静電的。酸性タンパク質には2価カチオン","最初の試行、天然膜、SLB"],
["APTES/グルタルアルデヒドマイカ","正のNH₂、共有結合","共有結合(しばしば配向制御)","安定な固定(F1-ATPase α3β3、bR三量体)"],
["SLB","粗さ無視可、流動性・電荷を調整可","ビオチン、Ni–NTA、荷電脂質","親和性の制御、高密度タンパク質、2次元結晶"],
["ストレプトアビジン2次元結晶","0.2〜0.3 nm(タイプ3)","ビオチン、多点固定","ホモオリゴマー:アクチン、GroEL–GroES、p97"],
["TM2-LPI 2次元結晶","約1 nm、マイカ上で数分で形成","ビオチン","迅速な調製、GroEL側面向き"]],
kt:"研究者のための要点",
k:["まず未修飾マイカから始め、カチオンとpHで調整します。配向や選択性が必要なときだけ機能化表面に進みます。",
"親和性の制御にはSLB、ホモオリゴマーの固定にはストレプトアビジン2次元結晶を使います。高密度の層は最も平滑で高分解能の表面を与えます。",
"粗さ、配向、表面での運動性を、表面が機能を乱す可能性の強さと照らし合わせて検討します。",
"TM2-LPIは迅速な方法ですが、粗さが大きく、これまでの検証例は限られています。"],
f:"T. Ando 著『High-Speed Atomic Force Microscopy in Biology』(Springer, 2022)第10章「Substrate Surfaces」の要約。"},

zh:{name:"简体中文",seal:"基",sub:"用于蛋白质HS-AFM成像的基底表面",
s:[
{h:"基底为何重要",l:[
"表面粗糙度必须远小于目标分子,而这些分子通常只有几纳米大小。与单分子荧光显微镜不同,基底本身就决定了HS-AFM能分辨什么。",
"AFM只能从正上方观察样品,因此有时必须让分子以特定取向附着,才能显露出感兴趣的结构特征。",
"在动态成像中,分子与表面的相互作用必须平衡:过强会干扰功能,过弱则分子移动过快而无法成像。",
"要观察两种分子之间的相互作用,通常需要选择性固定:固定其中一方并保持活性,另一方则在溶液中自由存在。",
"目前可用的基底选择仍然有限,因此表面的选择与调节是实验设计的一部分。"]},
{h:"10.1 裸云母与功能化云母",l:[
"云母(白云母或合成氟金云母)是首选尝试的基底:制备简单,大面积原子级平整,几乎能吸附所有蛋白质。",
"新解理的云母在水中带负电(K⁺脱离),有利于吸附带正电的蛋白质。一价阳离子减弱吸附的顺序为 K⁺ > Na⁺ > Li⁺,pH也可用于进一步调节。",
"带负电的蛋白质可通过二价阳离子(Mg²⁺、Ca²⁺、Ni²⁺、Zn²⁺)结合,这些离子即使用水冲洗后仍留在表面上。",
"取向通常无法控制,往往使接触面积最大化,但也有例外:GroEL和ClpB倾向于端面朝上吸附。",
"天然膜片段和支撑脂质双层(SLB)很适合裸云母,因为约1 nm的水层可将膜与表面隔开。",
"功能化:表面硅醇可与有机硅烷反应。APTES可得到带正电的NH₂表面;为避免聚合导致粗糙度增加,应在沉积前用水将其稀释1万至10万倍。",
"在NH₂表面上用戊二醛处理可得到氨基反应性表面,实现共价(通常有取向)固定(例如赖氨酸标记的F1-ATP酶α3β3、bR三聚体)。"]},
{h:"10.2 云母支撑脂质双层(SLB)",l:[
"小脂质体在云母上破裂并融合,形成覆盖整个支撑面、粗糙度可忽略的SLB,这一过程可用HS-AFM观察(图10.1)。",
"两性离子头部(PC、PE)可抵抗蛋白质吸附。生物素脂质可结合链霉亲和素偶联蛋白;Ni–NTA脂质可捕获His标签蛋白(如p97);肌球蛋白V的研究则使用了结合在链霉亲和素SLB上的生物素化肌动蛋白。",
"带电脂质(PS、PA、PG为负,TAP、EPC为正)可实现静电附着,只要不发生相分离,就能通过混合带电与中性脂质轻松调节表面电荷密度。",
"烷基链的饱和度决定流动性:DOPC(相变温度约−20 °C)等不饱和脂质形成高流动性SLB。这不适合观察孤立的单个分子,但适用于高密度蛋白质,其扩散减弱,并可形成表面起伏小的二维晶体,实现高分辨率成像(链霉亲和素、膜联蛋白V)。"]},
{h:"10.3 链霉亲和素二维晶体",l:[
"链霉亲和素是D2对称的同源四聚体;在二维晶体中两个生物素结合位点朝向溶液,且非特异性蛋白结合较少。生物素化蛋白(或通过生物素化Ni–NTA结合的His标签蛋白)可按受控取向附着。",
"晶体在具有流动性、含生物素的SLB上形成,依pH和离子强度呈三种排列(类型1–3,P2对称),更换缓冲液后仍可稳定超过12小时。戊二醛处理可增强机械强度并保留生物素亲和力。",
"类型3(pH 4.0、高离子强度)最为平滑,粗糙度为0.2–0.3 nm,对HS-AFM最有用。",
"局限:单个生物素–链霉亲和素键会让蛋白质发生转动。可通过双生物素试剂、多位点生物素化或带电生物素化合物降低运动性,因此该表面对单体蛋白的用途有限。",
"最适合可在多个位点固定的同源寡聚体:肌动蛋白聚合、GroEL–GroES相互作用以及p97的构象变化。"]},
{h:"10.4 Tamavidin二维晶体",l:[
"链霉亲和素晶体需要两步(先制备SLB,再结晶),耗时数小时。Tamavidin 2突变体LPI(TM2-LPI)可直接在云母上于5–10分钟内结晶,其等电点较低,因此非特异性结合较少(略高于链霉亲和素)。",
"流程概要:将TM2-LPI稀释至0.12 mg mL⁻¹,缓冲液为20 mM HEPES–NaOH pH 8.5、400 mM NaCl、200 mM MgCl₂、20%(w/v)PEG 8000;21 °C孵育30–50分钟;滴加到新解理的云母上;用不含PEG的缓冲液冲洗;用20 mM HEPES–NaOH pH 8.0稀释的2%戊二醛固定5分钟;再用观察缓冲液冲洗。",
"粗糙度约为1 nm(图10.2b),比链霉亲和素类型3更粗糙。迄今仅用于将生物素化GroEL侧向固定,使GroES能结合在其两端的环上。",
"用400 mM MgCl₂加0.01%戊二醛处理可制造空位缺陷。形成含生物素的SLB后,可将膜蛋白捕获在孔中,使膜两侧具有不对称环境,但从下层膜表面算起高度超过约4 nm的蛋白质无法容纳。"]}
],

th:{name:"ไทย",seal:"基",sub:"พื้นผิวรองรับสำหรับการถ่ายภาพโปรตีนด้วย HS-AFM",
s:[
{h:"เหตุใดพื้นผิวรองรับจึงสำคัญ",l:[
"ความขรุขระของพื้นผิวต้องเล็กกว่าโมเลกุลเป้าหมายมาก ซึ่งโดยทั่วไปมีขนาดเพียงไม่กี่นาโนเมตร ต่างจากกล้องจุลทรรศน์ฟลูออเรสเซนซ์โมเลกุลเดี่ยว พื้นผิวรองรับเองเป็นตัวกำหนดว่า HS-AFM จะแยกแยะอะไรได้",
"AFM มองเห็นตัวอย่างจากด้านบนเท่านั้น บางครั้งจึงต้องให้โมเลกุลยึดติดในทิศทางที่กำหนด เพื่อให้เห็นลักษณะโครงสร้างที่สนใจ",
"ในการถ่ายภาพเชิงพลวัต ปฏิสัมพันธ์ระหว่างโมเลกุลกับพื้นผิวต้องสมดุล หากแรงเกินไปจะรบกวนหน้าที่ของโมเลกุล หากอ่อนเกินไปโมเลกุลจะเคลื่อนที่เร็วจนถ่ายภาพไม่ได้",
"การถ่ายภาพปฏิสัมพันธ์ระหว่างโมเลกุลสองชนิดมักต้องใช้การตรึงแบบจำเพาะ คือตรึงฝ่ายหนึ่งโดยไม่สูญเสียกิจกรรม ขณะที่อีกฝ่ายอยู่อย่างอิสระในสารละลาย",
"ตัวเลือกของพื้นผิวรองรับที่ใช้ได้ยังมีจำกัด การเลือกและปรับพื้นผิวจึงเป็นส่วนหนึ่งของการออกแบบการทดลอง"]},
{h:"10.1 ไมกาเปล่าและไมกาที่ดัดแปลงหมู่ฟังก์ชัน",l:[
"ไมกา (มัสโคไวต์หรือฟลูออโรฟลอโกไพต์สังเคราะห์) เป็นสิ่งแรกที่ควรลอง เตรียมง่าย เรียบระดับอะตอมในพื้นที่กว้าง และดูดซับโปรตีนได้เกือบทุกชนิด",
"ไมกาที่เพิ่งแยกชั้นจะมีประจุลบในน้ำ (K⁺ หลุดออก) จึงเอื้อต่อโปรตีนที่มีประจุบวก ไอออนบวกประจุหนึ่งลดการดูดซับตามลำดับ K⁺ > Na⁺ > Li⁺ และยังปรับได้ด้วยค่า pH",
"โปรตีนประจุลบสามารถยึดติดผ่านไอออนบวกประจุสอง (Mg²⁺, Ca²⁺, Ni²⁺, Zn²⁺) ซึ่งยังคงอยู่บนพื้นผิวแม้ล้างด้วยน้ำแล้ว",
"โดยทั่วไปทิศทางของโมเลกุลควบคุมไม่ได้ และมักเป็นทิศที่ทำให้พื้นที่สัมผัสมากที่สุด แต่มีข้อยกเว้น เช่น GroEL และ ClpB มักวางโดยหันปลายขึ้น",
"ชิ้นส่วนเยื่อหุ้มธรรมชาติและแผ่นไขมันสองชั้นที่มีตัวรองรับ (SLB) เหมาะกับไมกาเปล่า เพราะชั้นน้ำหนาประมาณ 1 นาโนเมตรแยกเยื่อออกจากพื้นผิว",
"การดัดแปลงหมู่ฟังก์ชัน: หมู่ซิลานอลบนพื้นผิวทำปฏิกิริยากับออร์แกโนซิเลนได้ APTES ให้พื้นผิว NH₂ ประจุบวก ควรเจือจางด้วยน้ำ 10,000–100,000 เท่าก่อนหยดลงพื้นผิวทันที เพื่อป้องกันการเกิดพอลิเมอร์และความขรุขระที่เพิ่มขึ้น",
"การใช้กลูทารัลดีไฮด์กับพื้นผิว NH₂ ให้พื้นผิวที่ทำปฏิกิริยากับหมู่อะมีน เพื่อตรึงแบบโควาเลนต์ซึ่งมักควบคุมทิศทางได้ (เช่น α3β3 ของ F1-ATPase ที่ติดแท็กไลซีน และไตรเมอร์ bR)"]},
{h:"10.2 แผ่นไขมันสองชั้นบนไมกา (SLB)",l:[
"ไลโพโซมขนาดเล็กแตกออกบนไมกาแล้วหลอมรวมเป็น SLB ที่มีความขรุขระน้อยมากและคลุมพื้นผิวทั้งหมด กระบวนการนี้สังเกตได้ด้วย HS-AFM (รูปที่ 10.1)",
"หัวไขมันแบบสวิตเตอร์ไอออน (PC, PE) ต้านการดูดซับโปรตีน ไขมันที่มีไบโอตินจับโปรตีนที่เชื่อมกับสเตรปทาวิดิน ไขมัน Ni–NTA จับโปรตีนที่มีแท็ก His (เช่น p97) และเคยใช้แอคตินที่ติดไบโอตินบน SLB ที่มีสเตรปทาวิดินเพื่อศึกษาไมโอซิน V",
"ไขมันที่มีประจุ (PS, PA, PG ประจุลบ; TAP, EPC ประจุบวก) ช่วยให้ยึดติดด้วยแรงไฟฟ้าสถิต และปรับความหนาแน่นประจุผิวได้ง่ายโดยผสมไขมันมีประจุกับไขมันเป็นกลาง ตราบใดที่ไม่เกินการแยกวัฏภาค",
"ความอิ่มตัวของโซ่อัลคิลกำหนดความลื่นไหล ไขมันไม่อิ่มตัวอย่าง DOPC (อุณหภูมิเปลี่ยนวัฏภาคราว −20 °C) ให้ SLB ที่ลื่นไหลมาก ไม่เหมาะกับโมเลกุลเดี่ยวที่อยู่โดดเดี่ยว แต่มีประโยชน์กับโปรตีนที่หนาแน่น ซึ่งแพร่ได้น้อยลงและอาจก่อผลึกสองมิติที่พื้นผิวขรุขระน้อย ถ่ายภาพได้ละเอียดสูง (สเตรปทาวิดิน, แอนเน็กซิน V)"]},
{h:"10.3 ผลึกสองมิติของสเตรปทาวิดิน",l:[
"สเตรปทาวิดินเป็นโฮโมเททระเมอร์สมมาตร D2 ในผลึกสองมิติ ตำแหน่งจับไบโอติน 2 ตำแหน่งหันเข้าหาสารละลาย และการจับโปรตีนแบบไม่จำเพาะต่ำ โปรตีนที่ติดไบโอติน (หรือโปรตีนแท็ก His ผ่าน Ni–NTA ที่ติดไบโอติน) จึงยึดติดในทิศทางที่ควบคุมได้",
"ผลึกเกิดบน SLB ที่ลื่นไหลและมีไบโอติน มี 3 รูปแบบการจัดเรียง (ชนิด 1–3 สมมาตร P2) ตาม pH และความแรงไอออน และคงตัวได้นานกว่า 12 ชั่วโมงหลังเปลี่ยนบัฟเฟอร์ การใช้กลูทารัลดีไฮด์เพิ่มความแข็งแรงเชิงกลโดยยังคงความสามารถในการจับไบโอติน",
"ชนิด 3 (pH 4.0 ความแรงไอออนสูง) เรียบที่สุด ความขรุขระ 0.2–0.3 นาโนเมตร และมีประโยชน์ที่สุดสำหรับ HS-AFM",
"ข้อจำกัด: พันธะไบโอติน–สเตรปทาวิดินเพียงหนึ่งพันธะทำให้โปรตีนหมุนได้ ลดการเคลื่อนไหวได้ด้วยสารไดไบโอติน การติดไบโอตินหลายตำแหน่ง หรือสารประกอบไบโอตินที่มีประจุ พื้นผิวนี้จึงใช้ประโยชน์กับโปรตีนโมโนเมอร์ได้จำกัด",
"เหมาะที่สุดกับโฮโมโอลิโกเมอร์ที่ตรึงได้หลายตำแหน่ง ได้แก่ การเกิดพอลิเมอร์ของแอคติน ปฏิสัมพันธ์ GroEL–GroES และการเปลี่ยนแปลงโครงรูปของ p97"]},
{h:"10.4 ผลึกสองมิติของทามาวิดิน",l:[
"ผลึกสเตรปทาวิดินต้องทำสองขั้นตอน (SLB แล้วจึงตกผลึก) ใช้เวลาหลายชั่วโมง มิวเทน LPI ของทามาวิดิน 2 (TM2-LPI) ตกผลึกบนไมกาโดยตรงภายใน 5–10 นาที และมีจุดไอโซอิเล็กทริกต่ำกว่า จึงจับแบบไม่จำเพาะน้อยลง (แต่สูงกว่าสเตรปทาวิดินเล็กน้อย)",
"ขั้นตอนโดยสรุป: เจือจาง TM2-LPI เป็น 0.12 mg mL⁻¹ ในบัฟเฟอร์ 20 mM HEPES–NaOH pH 8.5, 400 mM NaCl, 200 mM MgCl₂, 20% (w/v) PEG 8000 บ่มที่ 21 °C นาน 30–50 นาที หยดลงบนไมกาที่เพิ่งแยกชั้น ล้างด้วยบัฟเฟอร์ที่ไม่มี PEG ตรึงด้วยกลูทารัลดีไฮด์ 2% ที่เจือจางด้วย 20 mM HEPES–NaOH pH 8.0 นาน 5 นาที แล้วล้างด้วยบัฟเฟอร์สำหรับสังเกต",
"ความขรุขระประมาณ 1 นาโนเมตร (รูปที่ 10.2b) ขรุขระกว่าสเตรปทาวิดินชนิด 3 จนถึงตอนนี้ใช้เพียงยึด GroEL ที่ติดไบโอตินในแนวด้านข้าง เพื่อให้ GroES จับได้ที่วงแหวนทั้งสองปลาย",
"สร้างช่องว่างบกพร่องได้โดยใช้ MgCl₂ 400 mM ร่วมกับกลูทารัลดีไฮด์ 0.01% เมื่อสร้าง SLB ที่มีไบโอตินบนผิวนี้ จะดักโปรตีนเยื่อหุ้มในรูเพื่อให้มีสภาพแวดล้อมไม่สมมาตรสองฝั่งของเยื่อได้ แต่โปรตีนที่สูงกว่าประมาณ 4 นาโนเมตรจากผิวเยื่อด้านล่างจะไม่พอดีกับรู"]}
],
tt:"เปรียบเทียบพื้นผิวแต่ละชนิด",th:["พื้นผิว","ลักษณะ","การยึดติด","เหมาะกับ"],
tr:[
["ไมกาเปล่า","เรียบระดับอะตอม ประจุลบ","แรงไฟฟ้าสถิต ใช้ไอออนบวกประจุสองกับโปรตีนกรด","การลองครั้งแรก เยื่อหุ้มธรรมชาติ และ SLB"],

var F={"en": {"f1": "Figure 10.1", "m": "min", "s": "s", "t1": "HS-AFM images of SLB formation on mica. Lipid composition: DOPC/DOPS/biotin-cap-DPPE (7:2:1 by weight). Multilamellar vesicles were prepared in buffer A (10 mM HEPES–NaOH, 150 mM NaCl, 2 mM CaCl₂, pH 7.4) and converted to small unilamellar vesicles by tip sonication; the suspension (0.5 mg/ml) was diluted directly into buffer A in the liquid cell. Imaging at 1.03 fps (800 × 800 nm; Z scale 25 nm). Lipid nanotubes about 20 nm high grew and ruptured over time; without biotin-cap-DPPE none formed.", "f2": "Figure 10.2", "t2": "AFM images of 2D crystals of (a) streptavidin formed on an SLB containing biotinylated lipid and (b) TM2-LPI formed directly on bare mica. The curve below shows the surface corrugation along the white line in (a). The RMS corrugation of the TM2-LPI crystal surface is about 1 nm."}, "ja": {"f1": "図10.1", "m": "分", "s": "秒", "t1": "マイカ上でSLBが形成される過程を示すHS-AFM像。脂質組成はDOPC/DOPS/biotin-cap-DPPE(重量比7:2:1)。多重膜ベシクルを緩衝液A(10 mM HEPES–NaOH、150 mM NaCl、2 mM CaCl₂、pH 7.4)中で調製し、先端型ソニケーターで小さな一枚膜ベシクルにしました。この懸濁液(0.5 mg/ml)を液体セル内の緩衝液Aに直接希釈しました。撮像速度は1.03 fps(800 × 800 nm、Zスケール25 nm)。高さ約20 nmの脂質ナノチューブが成長・破裂しました。biotin-cap-DPPEがないとナノチューブは形成されませんでした。", "f2": "図10.2", "t2": "(a)ビオチン化脂質を含むSLB上に形成したストレプトアビジンと、(b)未修飾マイカ上に直接形成したTM2-LPIの2次元結晶のAFM像。下の曲線は(a)の白線に沿った表面凹凸を示します。TM2-LPI結晶表面の凹凸のRMS値は約1 nmです。"}, "zh": {"f1": "图10.1", "m": "分钟", "s": "秒", "t1": "显示云母上SLB形成过程的HS-AFM图像。脂质组成为DOPC/DOPS/biotin-cap-DPPE(重量比7:2:1)。多层囊泡在缓冲液A(10 mM HEPES–NaOH、150 mM NaCl、2 mM CaCl₂,pH 7.4)中制备,经探头超声处理得到小单层囊泡;该悬液(0.5 mg/ml)直接稀释到液体池中的缓冲液A里。成像速度为1.03 fps(800 × 800 nm;Z轴范围25 nm)。高约20 nm的脂质纳米管随时间生长并断裂;没有biotin-cap-DPPE时则不会形成。", "f2": "图10.2", "t2": "(a)含生物素化脂质的SLB上形成的链霉亲和素二维晶体,以及(b)直接在裸云母上形成的TM2-LPI二维晶体的AFM图像。下方曲线表示沿(a)中白线的表面起伏。TM2-LPI晶体表面起伏的均方根值约为1 nm。"}, "th": {"f1": "รูปที่ 10.1", "m": "นาที", "s": "วินาที", "t1": "ภาพ HS-AFM แสดงกระบวนการเกิด SLB บนไมกา องค์ประกอบไขมันคือ DOPC/DOPS/biotin-cap-DPPE (อัตราส่วนโดยน้ำหนัก 7:2:1) เตรียมเวสิเคิลหลายชั้นในบัฟเฟอร์ A (10 mM HEPES–NaOH, 150 mM NaCl, 2 mM CaCl₂, pH 7.4) แล้วใช้หัวโซนิเคเตอร์ทำให้เป็นเวสิเคิลชั้นเดียวขนาดเล็ก จากนั้นเจือจางสารแขวนลอย (0.5 mg/ml) ลงในบัฟเฟอร์ A ในเซลล์ของเหลวโดยตรง ถ่ายภาพที่ 1.03 fps (800 × 800 nm; สเกลแกน Z 25 nm) ท่อนาโนไขมันสูงราว 20 nm เติบโตและแตกออกตามเวลา และไม่เกิดขึ้นหากไม่มี biotin-cap-DPPE", "f2": "รูปที่ 10.2", "t2": "ภาพ AFM ของผลึกสองมิติของ (a) สเตรปทาวิดินที่เกิดบน SLB ซึ่งมีไขมันติดไบโอติน และ (b) TM2-LPI ที่เกิดบนไมกาเปล่าโดยตรง เส้นโค้งด้านล่างแสดงความขรุขระของพื้นผิวตามเส้นสีขาวใน (a) ค่า RMS ของความขรุขระของผลึก TM2-LPI ประมาณ 1 nm"}};
